name: CI — O'Pokedex

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── JOB 1 : Tests & Lint ─────────────────────────────────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    # Service PostgreSQL de test — identique à votre docker-compose
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin_pokedex
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: pokedex_test
        ports:
          - 5432:5432
        # Attend que PostgreSQL soit prêt avant de continuer
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: 📦 Installer les dépendances
        working-directory: ./api
        run: npm ci

      - name: 🔍 Lint ESLint
        working-directory: ./api
        run: npm run lint
        continue-on-error: false

      - name: 🧪 Lancer les tests Jest
        working-directory: ./api
        run: npm test
        env:
          NODE_ENV: test
          PG_URL: postgres://admin_pokedex:test_password@localhost:5432/pokedex_test
          JWT_SECRET: secret_de_test_ci_cd_pipeline

  # ─── JOB 2 : Build Docker (bloqué si les tests échouent) ──────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test        # Ce job ne démarre QUE si le job "test" passe

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐳 Construire l'image Docker de l'API
        run: |
          docker build \
            -f api/Dockerfile.api \
            -t opokedex-api:${{ github.sha }} \
            ./api