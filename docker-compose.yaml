services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin_pokedex
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api 
    restart: on-failure
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - PG_URL=
      - JWT_SECRET=
      - NODE_ENV=d
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=
      - VITE_API_URL=
    depends_on:
      - api
    command: npm run dev -- --host

volumes:
  db_data:
